<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 130" width="100%" height="130" fill="none">
  <defs>
    <style>
      @keyframes ping {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.25; }
      }
      .ping { animation: ping 1.6s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) {
        .ping { animation: none !important; }
      }
    </style>
  </defs>

  <!-- Outer Boundary -->
  <rect width="830" height="130" rx="8" fill="#0D1117" stroke="#30363D" stroke-width="1.2"/>

  <!-- Channel 01: Email -->
  
  <g transform="translate(15, 15)">
    <rect width="260" height="100" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1.2"/>
    <circle cx="34" cy="50" r="15" fill="rgba(88, 230, 217, 0.15)" stroke="#58E6D9" stroke-opacity="0.35" stroke-width="1"/>
    <text x="34" y="54" text-anchor="middle" font-family="'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#58E6D9">@</text>
    <text x="60" y="34" font-family="'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="9" font-weight="700" letter-spacing="1" fill="#58E6D9">CH_01 // DIRECT MAIL</text>
    <text x="60" y="54" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#E6EDF3">Email</text>
    <text x="60" y="74" font-family="'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#8B949E">ishan.vaidya01@gmail.com</text>
    <circle cx="245" cy="15" r="3" fill="#34D399" class="ping"/>
  </g>
  <!-- Channel 02: LinkedIn -->
  
  <g transform="translate(285, 15)">
    <rect width="260" height="100" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1.2"/>
    <circle cx="34" cy="50" r="15" fill="rgba(88, 230, 217, 0.15)" stroke="#58E6D9" stroke-opacity="0.35" stroke-width="1"/>
    <text x="34" y="54" text-anchor="middle" font-family="'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#58E6D9">in</text>
    <text x="60" y="34" font-family="'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="9" font-weight="700" letter-spacing="1" fill="#58E6D9">CH_02 // NETWORK NODE</text>
    <text x="60" y="54" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#E6EDF3">LinkedIn</text>
    <text x="60" y="74" font-family="'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#8B949E">linkedin.com/in/ishanvaidya-cse</text>
    <circle cx="245" cy="15" r="3" fill="#34D399" class="ping"/>
  </g>
  <!-- Channel 03: GitHub -->
  
  <g transform="translate(555, 15)">
    <rect width="260" height="100" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1.2"/>
    <circle cx="34" cy="50" r="15" fill="rgba(88, 230, 217, 0.15)" stroke="#58E6D9" stroke-opacity="0.35" stroke-width="1"/>
    <text x="34" y="54" text-anchor="middle" font-family="'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#58E6D9">&#123; &#125;</text>
    <text x="60" y="34" font-family="'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="9" font-weight="700" letter-spacing="1" fill="#58E6D9">CH_03 // CODE BASE</text>
    <text x="60" y="54" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#E6EDF3">Portfolio</text>
    <text x="60" y="74" font-family="'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#8B949E">@ishanvaidya01</text>
    <circle cx="245" cy="15" r="3" fill="#34D399" class="ping"/>
  </g>

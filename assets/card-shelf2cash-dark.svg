<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 405 148" width="100%" height="148" fill="none">
  <defs>
    <style>
      .mono { font-family: 'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
      .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
    </style>
  </defs>

  <!-- Card Frame -->
  <rect width="405" height="148" rx="7" fill="#0D1117" stroke="#30363D" stroke-width="1.2"/>

  <!-- Content -->
  <g transform="translate(20, 20)">
    <!-- Header: Title + Tag -->
    <text x="0" y="14" fill="#E6EDF3" class="sans" font-size="15" font-weight="700">Shelf2Cash</text>
    <rect x="275" y="0" width="90" height="18" rx="9" fill="rgba(88, 230, 217, 0.15)"/>
    <text x="320" y="12.5" text-anchor="middle" fill="#58E6D9" class="mono" font-size="8.5" font-weight="700">FINTECH ENGINE</text>

    <!-- Pitch (2 sharp sentences) -->
    <text x="0" y="42" fill="#E6EDF3" class="sans" font-size="11.5" font-weight="400">Kirana retail financial engine with MongoDB Geospatial cluster matchmaking.</text>
    <text x="0" y="60" fill="#8B949E" class="sans" font-size="11.5">FastAPI ML microservice models historical replenishment to drive micro-factoring.</text>

    <!-- Stack Chips -->
    <g transform="translate(0, 88)">
      
        <rect x="0" y="0" width="91" height="19" rx="3.5" fill="#21262D" stroke="#30363D"/>
        <text x="45.5" y="12.5" text-anchor="middle" fill="#C9D1D9" font-family="'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="9">MongoDB Geo</text>
        
        <rect x="97" y="0" width="63" height="19" rx="3.5" fill="#21262D" stroke="#30363D"/>
        <text x="128.5" y="12.5" text-anchor="middle" fill="#C9D1D9" font-family="'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="9">FastAPI</text>
        
        <rect x="166" y="0" width="119" height="19" rx="3.5" fill="#21262D" stroke="#30363D"/>
        <text x="225.5" y="12.5" text-anchor="middle" fill="#C9D1D9" font-family="'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="9">ML Microservice</text>
        
        <rect x="291" y="0" width="49" height="19" rx="3.5" fill="#21262D" stroke="#30363D"/>
        <text x="315.5" y="12.5" text-anchor="middle" fill="#C9D1D9" font-family="'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="9">React</text>
        
    </g>
  </g>
</svg>
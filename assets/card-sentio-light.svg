<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 405 168" width="100%" height="168" fill="none">
  <defs>
    <style>
      .mono { font-family: 'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
      .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
    </style>
  </defs>

  <!-- Card Frame -->
  <rect width="405" height="168" rx="7" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.2"/>

  <!-- Content -->
  <g transform="translate(18, 18)">
    <!-- Header: Title + Tag -->
    <text x="0" y="14" fill="#1F2328" class="sans" font-size="15" font-weight="700">Sentio</text>
    <rect x="270" y="0" width="100" height="18" rx="9" fill="rgba(13, 148, 136, 0.12)"/>
    <text x="320" y="12.5" text-anchor="middle" fill="#0D9488" class="mono" font-size="8.5" font-weight="700">TELEMETRY</text>

    <!-- Pitch Line 1 & 2 (Primary) -->
    <text x="0" y="46" fill="#1F2328" class="sans" font-size="11" font-weight="500">Robotic telemetry black box streaming sub-second data</text><text x="0" y="62" fill="#1F2328" class="sans" font-size="11" font-weight="500">via Node.js SSE.</text>

    <!-- Pitch Line 3 & 4 (Architecture) -->
    <text x="0" y="80" fill="#656D76" class="sans" font-size="10.8">In-memory circular ring buffers prevent memory</text><text x="0" y="95" fill="#656D76" class="sans" font-size="10.8">fragmentation under multi-kHz bursts.</text>

    <!-- Stack Chips -->
    <g transform="translate(0, 122)">
      
        <rect x="0" y="0" width="61.6" height="19" rx="3.5" fill="#EAEEF2" stroke="#D0D7DE"/>
        <text x="30.8" y="12.5" text-anchor="middle" fill="#24292F" font-family="'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="9">Node.js</text>
        
        <rect x="67.6" y="0" width="46" height="19" rx="3.5" fill="#EAEEF2" stroke="#D0D7DE"/>
        <text x="90.6" y="12.5" text-anchor="middle" fill="#24292F" font-family="'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="9">SSE</text>
        
        <rect x="119.6" y="0" width="95.6" height="19" rx="3.5" fill="#EAEEF2" stroke="#D0D7DE"/>
        <text x="167.39999999999998" y="12.5" text-anchor="middle" fill="#24292F" font-family="'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="9">Ring Buffers</text>
        
        <rect x="221.2" y="0" width="95.6" height="19" rx="3.5" fill="#EAEEF2" stroke="#D0D7DE"/>
        <text x="269.0" y="12.5" text-anchor="middle" fill="#24292F" font-family="'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="9">AudioContext</text>
        
    </g>
  </g>
</svg>
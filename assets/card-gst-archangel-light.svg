<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 405 148" width="100%" height="148" fill="none">
  <defs>
    <style>
      .mono { font-family: 'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
      .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
    </style>
  </defs>

  <!-- Card Frame -->
  <rect width="405" height="148" rx="7" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.2"/>

  <!-- Content -->
  <g transform="translate(20, 20)">
    <!-- Header: Title + Tag -->
    <text x="0" y="14" fill="#1F2328" class="sans" font-size="15" font-weight="700">GST Archangel</text>
    <rect x="275" y="0" width="90" height="18" rx="9" fill="rgba(13, 148, 136, 0.12)"/>
    <text x="320" y="12.5" text-anchor="middle" fill="#0D9488" class="mono" font-size="8.5" font-weight="700">AGENT SWARM</text>

    <!-- Pitch (2 sharp sentences) -->
    <text x="0" y="42" fill="#1F2328" class="sans" font-size="11.5" font-weight="400">Multi-agent AI accountant coordinating 7 specialized agents (OCR, Recon, Risk).</text>
    <text x="0" y="60" fill="#656D76" class="sans" font-size="11.5">Runs fine-tuned local Donut models, statutory RAG, and live WebSocket thought streams.</text>

    <!-- Stack Chips -->
    <g transform="translate(0, 88)">
      
        <rect x="0" y="0" width="70" height="19" rx="3.5" fill="#EAEEF2" stroke="#D0D7DE"/>
        <text x="35.0" y="12.5" text-anchor="middle" fill="#24292F" font-family="'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="9">7 Agents</text>
        
        <rect x="76" y="0" width="77" height="19" rx="3.5" fill="#EAEEF2" stroke="#D0D7DE"/>
        <text x="114.5" y="12.5" text-anchor="middle" fill="#24292F" font-family="'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="9">Donut OCR</text>
        
        <rect x="159" y="0" width="46" height="19" rx="3.5" fill="#EAEEF2" stroke="#D0D7DE"/>
        <text x="182.0" y="12.5" text-anchor="middle" fill="#24292F" font-family="'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="9">RAG</text>
        
        <rect x="211" y="0" width="84" height="19" rx="3.5" fill="#EAEEF2" stroke="#D0D7DE"/>
        <text x="253.0" y="12.5" text-anchor="middle" fill="#24292F" font-family="'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="9">WebSockets</text>
        
    </g>
  </g>
</svg>
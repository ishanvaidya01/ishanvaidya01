<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 200" width="100%" height="200" fill="none">
  <defs>
    <style>
      .mono { font-family: 'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
      .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
      
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes type-seq1 {
        0% { opacity: 0; transform: translateX(-4px); }
        8%, 95% { opacity: 1; transform: translateX(0); }
        100% { opacity: 1; }
      }
      @keyframes type-seq2 {
        0%, 30% { opacity: 0; transform: translateX(-4px); }
        38%, 95% { opacity: 1; transform: translateX(0); }
        100% { opacity: 1; }
      }
      @keyframes type-seq3 {
        0%, 60% { opacity: 0; transform: translateX(-4px); }
        68%, 95% { opacity: 1; transform: translateX(0); }
        100% { opacity: 1; }
      }

      .cursor {
        animation: blink 1s infinite;
      }
      .l1 { animation: type-seq1 12s infinite; }
      .l2 { animation: type-seq2 12s infinite; }
      .l3 { animation: type-seq3 12s infinite; }

      @media (prefers-reduced-motion: reduce) {
        .l1, .l2, .l3 { animation: none !important; opacity: 1 !important; transform: none !important; }
        .cursor { animation: none !important; opacity: 1 !important; }
      }
    </style>
  </defs>

  <!-- Window Frame -->
  <rect width="590" height="200" rx="8" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.2"/>
  
  <!-- Titlebar -->
  <path d="M 0 8 Q 0 0 8 0 L 582 0 Q 590 0 590 8 L 590 32 L 0 32 Z" fill="#F6F8FA"/>
  <line x1="0" y1="32" x2="590" y2="32" stroke="#D0D7DE" stroke-width="1"/>

  <!-- Window Controls -->
  <circle cx="20" cy="16" r="5" fill="#FF5F56"/>
  <circle cx="36" cy="16" r="5" fill="#FFBD2E"/>
  <circle cx="52" cy="16" r="5" fill="#27C93F"/>

  <!-- Title & Status -->
  <text x="295" y="20" text-anchor="middle" fill="#656D76" class="mono" font-size="11" font-weight="600">ishan@architect: ~ (zsh)</text>
  <rect x="500" y="8" width="76" height="16" rx="8" fill="rgba(13, 148, 136, 0.12)"/>
  <circle cx="510" cy="16" r="3" fill="#0D9488"/>
  <text x="518" y="19" fill="#0D9488" class="mono" font-size="9" font-weight="700">SYS_OK</text>

  <!-- Terminal Body Grid -->
  <line x1="24" y1="75" x2="566" y2="75" stroke="rgba(0, 0, 0, 0.03)" stroke-width="1"/>
  <line x1="24" y1="120" x2="566" y2="120" stroke="rgba(0, 0, 0, 0.03)" stroke-width="1"/>
  <line x1="24" y1="165" x2="566" y2="165" stroke="rgba(0, 0, 0, 0.03)" stroke-width="1"/>

  <!-- Line 1: whoami -->
  <g class="l1">
    <text x="24" y="60" fill="#0D9488" class="mono" font-size="12" font-weight="700">$</text>
    <text x="38" y="60" fill="#1F2328" class="mono" font-size="12" font-weight="600">whoami</text>
    <text x="96" y="60" fill="#656D76" class="mono" font-size="12">&#8594;</text>
    <text x="114" y="60" fill="#1F2328" class="mono" font-size="12" font-weight="700">ishan_vaidya</text>
    <text x="220" y="60" fill="#656D76" class="mono" font-size="11">// CSE @ VIT Chennai</text>
  </g>

  <!-- Line 2: cat stack.txt -->
  <g class="l2">
    <text x="24" y="105" fill="#0D9488" class="mono" font-size="12" font-weight="700">$</text>
    <text x="38" y="105" fill="#1F2328" class="mono" font-size="12" font-weight="600">cat stack.txt</text>
    <text x="146" y="105" fill="#656D76" class="mono" font-size="12">&#8594;</text>
    <text x="164" y="105" fill="#0D9488" class="mono" font-size="12" font-weight="600">postgres &#183; websockets &#183; langchain &#183; onnx</text>
  </g>

  <!-- Line 3: ./build -->
  <g class="l3">
    <text x="24" y="150" fill="#0D9488" class="mono" font-size="12" font-weight="700">$</text>
    <text x="38" y="150" fill="#1F2328" class="mono" font-size="12" font-weight="600">./build --concurrency-safe --offline-first --agentic</text>
    <text x="24" y="178" fill="#16A34A" class="mono" font-size="11" font-weight="600">[DONE] zero race conditions &#183; deterministic tools &#183; live feeds</text>
    <rect x="496" y="167" width="7" height="13" fill="#0D9488" class="cursor"/>
  </g>
</svg>
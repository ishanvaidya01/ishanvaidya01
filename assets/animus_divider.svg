<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 30" width="100%" height="30">
  <defs>
    <linearGradient id="div-laser-left" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(0, 240, 255, 0)"/>
      <stop offset="70%" stop-color="rgba(0, 240, 255, 0.4)"/>
      <stop offset="100%" stop-color="#ff003c"/>
    </linearGradient>
    <linearGradient id="div-laser-right" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff003c"/>
      <stop offset="30%" stop-color="rgba(0, 240, 255, 0.4)"/>
      <stop offset="100%" stop-color="rgba(0, 240, 255, 0)"/>
    </linearGradient>
  </defs>

  <!-- Left Laser Track -->
  <line x1="20" y1="15" x2="460" y2="15" stroke="url(#div-laser-left)" stroke-width="1.5"/>
  <circle cx="460" cy="15" r="2.5" fill="#00f0ff"/>

  <!-- Center Assassin Crest Icon -->
  <g transform="translate(500, 15)">
    <!-- Outer Diamond Reticle -->
    <polygon points="0,-12 12,0 0,12 -12,0" fill="none" stroke="#00f0ff" stroke-width="1"/>
    <polygon points="0,-6 6,0 0,6 -6,0" fill="#ff003c"/>
    <!-- Central Pip -->
    <circle cx="0" cy="0" r="1.5" fill="#ffffff"/>
  </g>

  <!-- Right Laser Track -->
  <circle cx="540" cy="15" r="2.5" fill="#ff003c"/>
  <line x1="540" y1="15" x2="980" y2="15" stroke="url(#div-laser-right)" stroke-width="1.5"/>

  <!-- Ticks -->
  <line x1="200" y1="11" x2="200" y2="19" stroke="rgba(0, 240, 255, 0.4)" stroke-width="1"/>
  <line x1="210" y1="13" x2="210" y2="17" stroke="rgba(0, 240, 255, 0.3)" stroke-width="1"/>
  <line x1="800" y1="11" x2="800" y2="19" stroke="rgba(255, 0, 60, 0.4)" stroke-width="1"/>
  <line x1="790" y1="13" x2="790" y2="17" stroke="rgba(255, 0, 60, 0.3)" stroke-width="1"/>
</svg>
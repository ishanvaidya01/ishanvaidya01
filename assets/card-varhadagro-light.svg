<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 405 148" width="100%" height="148" fill="none">
  <defs>
    <style>
      .mono { font-family: 'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
      .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
    </style>
  </defs>

  <!-- Card Frame -->
  <rect width="405" height="148" rx="7" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.2"/>

  <!-- Content -->
  <g transform="translate(20, 20)">
    <!-- Header: Title + Tag -->
    <text x="0" y="14" fill="#1F2328" class="sans" font-size="15" font-weight="700">VarhadAgro</text>
    <rect x="275" y="0" width="90" height="18" rx="9" fill="rgba(13, 148, 136, 0.12)"/>
    <text x="320" y="12.5" text-anchor="middle" fill="#0D9488" class="mono" font-size="8.5" font-weight="700">AGRONOMY ML</text>

    <!-- Pitch (2 sharp sentences) -->
    <text x="0" y="42" fill="#1F2328" class="sans" font-size="11.5" font-weight="400">Regional crop-yield prediction engine achieving R² 0.92 across the Vidarbha basin.</text>
    <text x="0" y="60" fill="#656D76" class="sans" font-size="11.5">Fuses rainfall, temperature, and dry-spell duration metrics into kg/ha forecasts.</text>

    <!-- Stack Chips -->
    <g transform="translate(0, 88)">
      
        <rect x="0" y="0" width="98" height="19" rx="3.5" fill="#EAEEF2" stroke="#D0D7DE"/>
        <text x="49.0" y="12.5" text-anchor="middle" fill="#24292F" font-family="'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="9">Scikit-Learn</text>
        
        <rect x="104" y="0" width="63" height="19" rx="3.5" fill="#EAEEF2" stroke="#D0D7DE"/>
        <text x="135.5" y="12.5" text-anchor="middle" fill="#24292F" font-family="'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="9">FastAPI</text>
        
        <rect x="173" y="0" width="63" height="19" rx="3.5" fill="#EAEEF2" stroke="#D0D7DE"/>
        <text x="204.5" y="12.5" text-anchor="middle" fill="#24292F" font-family="'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="9">R² 0.92</text>
        
        <rect x="242" y="0" width="56" height="19" rx="3.5" fill="#EAEEF2" stroke="#D0D7DE"/>
        <text x="270.0" y="12.5" text-anchor="middle" fill="#24292F" font-family="'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="9">Python</text>
        
    </g>
  </g>
</svg>
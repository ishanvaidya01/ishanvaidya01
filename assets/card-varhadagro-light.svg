<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 405 168" width="100%" height="168" fill="none">
  <defs>
    <style>
      .mono { font-family: 'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
      .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
    </style>
  </defs>

  <!-- Card Frame -->
  <rect width="405" height="168" rx="7" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.2"/>

  <!-- Content -->
  <g transform="translate(18, 18)">
    <!-- Header: Title + Tag -->
    <text x="0" y="14" fill="#1F2328" class="sans" font-size="15" font-weight="700">VarhadAgro</text>
    <rect x="270" y="0" width="100" height="18" rx="9" fill="rgba(13, 148, 136, 0.12)"/>
    <text x="320" y="12.5" text-anchor="middle" fill="#0D9488" class="mono" font-size="8.5" font-weight="700">AGRONOMY ML</text>

    <!-- Pitch Line 1 & 2 (Primary) -->
    <text x="0" y="46" fill="#1F2328" class="sans" font-size="11" font-weight="500">Regional crop-yield prediction engine achieving R²</text><text x="0" y="62" fill="#1F2328" class="sans" font-size="11" font-weight="500">0.92 across the Vidarbha basin.</text>

    <!-- Pitch Line 3 & 4 (Architecture) -->
    <text x="0" y="80" fill="#656D76" class="sans" font-size="10.8">Fuses rainfall, temperature, and dry-spell duration</text><text x="0" y="95" fill="#656D76" class="sans" font-size="10.8">metrics into kg/ha forecasts.</text>

    <!-- Stack Chips -->
    <g transform="translate(0, 122)">
      
        <rect x="0" y="0" width="95.6" height="19" rx="3.5" fill="#EAEEF2" stroke="#D0D7DE"/>
        <text x="47.8" y="12.5" text-anchor="middle" fill="#24292F" font-family="'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="9">Scikit-Learn</text>
        
        <rect x="101.6" y="0" width="61.6" height="19" rx="3.5" fill="#EAEEF2" stroke="#D0D7DE"/>
        <text x="132.4" y="12.5" text-anchor="middle" fill="#24292F" font-family="'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="9">FastAPI</text>
        
        <rect x="169.2" y="0" width="61.6" height="19" rx="3.5" fill="#EAEEF2" stroke="#D0D7DE"/>
        <text x="200.0" y="12.5" text-anchor="middle" fill="#24292F" font-family="'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="9">R² 0.92</text>
        
        <rect x="236.79999999999998" y="0" width="54.8" height="19" rx="3.5" fill="#EAEEF2" stroke="#D0D7DE"/>
        <text x="264.2" y="12.5" text-anchor="middle" fill="#24292F" font-family="'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="9">Python</text>
        
    </g>
  </g>
</svg>
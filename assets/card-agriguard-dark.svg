<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 405 168" width="100%" height="168" fill="none">
  <defs>
    <style>
      .mono { font-family: 'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
      .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
    </style>
  </defs>

  <!-- Card Frame -->
  <rect width="405" height="168" rx="7" fill="#0D1117" stroke="#30363D" stroke-width="1.2"/>

  <!-- Content -->
  <g transform="translate(18, 18)">
    <!-- Header: Title + Tag -->
    <text x="0" y="14" fill="#E6EDF3" class="sans" font-size="15" font-weight="700">AgriGuard</text>
    <rect x="270" y="0" width="100" height="18" rx="9" fill="rgba(88, 230, 217, 0.15)"/>
    <text x="320" y="12.5" text-anchor="middle" fill="#58E6D9" class="mono" font-size="8.5" font-weight="700">COMPUTER VISION</text>

    <!-- Pitch Line 1 & 2 (Primary) -->
    <text x="0" y="46" fill="#E6EDF3" class="sans" font-size="11" font-weight="500">Crop disease diagnostics pairing FastAPI with a</text><text x="0" y="62" fill="#E6EDF3" class="sans" font-size="11" font-weight="500">convolutional TensorFlow model.</text>

    <!-- Pitch Line 3 & 4 (Architecture) -->
    <text x="0" y="80" fill="#8B949E" class="sans" font-size="10.8">Leaflet maps track outbreaks, dispatching dual</text><text x="0" y="95" fill="#8B949E" class="sans" font-size="10.8">organic/chemical treatment remedies.</text>

    <!-- Stack Chips -->
    <g transform="translate(0, 122)">
      
        <rect x="0" y="0" width="82.0" height="19" rx="3.5" fill="#21262D" stroke="#30363D"/>
        <text x="41.0" y="12.5" text-anchor="middle" fill="#C9D1D9" font-family="'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="9">TensorFlow</text>
        
        <rect x="88.0" y="0" width="61.6" height="19" rx="3.5" fill="#21262D" stroke="#30363D"/>
        <text x="118.8" y="12.5" text-anchor="middle" fill="#C9D1D9" font-family="'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="9">FastAPI</text>
        
        <rect x="155.6" y="0" width="61.6" height="19" rx="3.5" fill="#21262D" stroke="#30363D"/>
        <text x="186.4" y="12.5" text-anchor="middle" fill="#C9D1D9" font-family="'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="9">Leaflet</text>
        
        <rect x="223.2" y="0" width="116.0" height="19" rx="3.5" fill="#21262D" stroke="#30363D"/>
        <text x="281.2" y="12.5" text-anchor="middle" fill="#C9D1D9" font-family="'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="9">Computer Vision</text>
        
    </g>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 160" width="100%" height="160" fill="none">
  <defs>
    <linearGradient id="livepass-border-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#30363D"/>
      <stop offset="100%" stop-color="#58E6D9"/>
    </linearGradient>
    <style>
      .mono { font-family: 'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
      .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
    </style>
  </defs>

  <!-- Card Background & Accent Border -->
  <rect width="830" height="160" rx="8" fill="#0D1117" stroke="url(#livepass-border-dark)" stroke-width="1.8"/>

  <!-- Content Container (Full Width) -->
  <g transform="translate(28, 22)">
    <!-- Badges Row -->
    <rect x="0" y="0" width="100" height="20" rx="4" fill="rgba(245, 158, 11, 0.15)"/>
    <text x="50" y="13" text-anchor="middle" fill="#F59E0B" class="mono" font-size="9.5" font-weight="700">&#9733; FLAGSHIP</text>

    <rect x="108" y="0" width="154" height="20" rx="4" fill="rgba(88, 230, 217, 0.15)"/>
    <text x="185" y="13" text-anchor="middle" fill="#58E6D9" class="mono" font-size="9.5" font-weight="700">HIGH-CONCURRENCY</text>

    <!-- Right Header Spec -->
    <text x="774" y="13.5" text-anchor="end" fill="#8B949E" class="mono" font-size="9.5">ACID SERIALIZABLE &#183; SUB-100MS SYNC</text>

    <!-- Title -->
    <text x="0" y="44" fill="#E6EDF3" class="sans" font-size="19" font-weight="800" letter-spacing="-0.3">LivePass</text>
    <text x="86" y="44" fill="#8B949E" class="mono" font-size="12">&#8212; High-Throughput Access Governance &amp; Ingestion Engine</text>

    <!-- Pitch Line 1 -->
    <text x="0" y="68" fill="#E6EDF3" class="sans" font-size="12" font-weight="500">Eliminates double-redemption race conditions during burst ingress using PostgreSQL row-level locks (<tspan fill="#58E6D9" class="mono" font-weight="700">SELECT FOR UPDATE</tspan>).</text>

    <!-- Pitch Line 2 -->
    <text x="0" y="88" fill="#8B949E" class="sans" font-size="11.5">Coordinates an offline-first client architecture via IndexedDB with cryptographic idempotency keys and live WebSocket broadcasts.</text>

    <!-- Stack Chips & Metrics -->
    <g transform="translate(0, 108)">
      <rect x="0" y="0" width="76" height="20" rx="4" fill="#21262D" stroke="#30363D"/>
      <text x="38" y="13" text-anchor="middle" fill="#C9D1D9" class="mono" font-size="9.5">PostgreSQL</text>

      <rect x="84" y="0" width="60" height="20" rx="4" fill="#21262D" stroke="#30363D"/>
      <text x="114" y="13" text-anchor="middle" fill="#C9D1D9" class="mono" font-size="9.5">FastAPI</text>

      <rect x="152" y="0" width="76" height="20" rx="4" fill="#21262D" stroke="#30363D"/>
      <text x="190" y="13" text-anchor="middle" fill="#C9D1D9" class="mono" font-size="9.5">WebSockets</text>

      <rect x="236" y="0" width="72" height="20" rx="4" fill="#21262D" stroke="#30363D"/>
      <text x="272" y="13" text-anchor="middle" fill="#C9D1D9" class="mono" font-size="9.5">IndexedDB</text>

      <rect x="316" y="0" width="50" height="20" rx="4" fill="#21262D" stroke="#30363D"/>
      <text x="341" y="13" text-anchor="middle" fill="#C9D1D9" class="mono" font-size="9.5">React</text>

      <rect x="374" y="0" width="80" height="20" rx="4" fill="#21262D" stroke="#30363D"/>
      <text x="414" y="13" text-anchor="middle" fill="#C9D1D9" class="mono" font-size="9.5">Tailwind CSS</text>

      <!-- Right Metric Badge -->
      <rect x="674" y="0" width="100" height="20" rx="10" fill="rgba(88, 230, 217, 0.15)" stroke="#21262D"/>
      <circle cx="686" cy="10" r="3" fill="#58E6D9"/>
      <text x="734" y="13" text-anchor="middle" fill="#58E6D9" class="mono" font-size="9" font-weight="700">ZERO RACES</text>
    </g>
  </g>
</svg>
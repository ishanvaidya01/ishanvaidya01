<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 156" width="100%" height="156" fill="none">
  <defs>
    <style>
      .stat-val {
        font-family: 'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
        font-weight: 700;
        font-size: 20px;
        letter-spacing: -0.5px;
      }
      .stat-lbl {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        font-weight: 600;
        font-size: 11px;
        letter-spacing: 0.5px;
        text-transform: uppercase;
      }
      .sec-hdr {
        font-family: 'SF Mono', 'JetBrains Mono', ui-monospace, monospace;
        font-weight: 700;
        font-size: 11px;
        letter-spacing: 1px;
      }
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="830" height="156" rx="8" fill="#0D1117" stroke="#30363D" stroke-width="1.2"/>

  <!-- Header line -->
  <g transform="translate(30, 26)">
    <text x="0" y="0" fill="#58E6D9" class="sec-hdr">// SYSTEM TELEMETRY &amp; COMMIT VOLUME</text>
    <rect x="680" y="-12" width="90" height="18" rx="9" fill="rgba(88, 230, 217, 0.12)"/>
    <circle cx="690" cy="-3" r="3" fill="#58E6D9"/>
    <text x="698" y="0" font-family="'SF Mono', monospace" font-size="9.5" font-weight="700" fill="#58E6D9">LIVE</text>
  </g>

  <!-- Metric Columns (4 items) -->
  <g transform="translate(30, 48)">
    <!-- Commits -->
    <g transform="translate(0, 0)">
      <text x="0" y="18" fill="#E6EDF3" class="stat-val">154</text>
      <text x="0" y="34" fill="#8B949E" class="stat-lbl">Yearly Commits</text>
    </g>

    <!-- PRs -->
    <g transform="translate(200, 0)">
      <text x="0" y="18" fill="#E6EDF3" class="stat-val">2</text>
      <text x="0" y="34" fill="#8B949E" class="stat-lbl">Pull Requests</text>
    </g>

    <!-- Repos -->
    <g transform="translate(400, 0)">
      <text x="0" y="18" fill="#E6EDF3" class="stat-val">12</text>
      <text x="0" y="34" fill="#8B949E" class="stat-lbl">Repositories</text>
    </g>

    <!-- Active Streak -->
    <g transform="translate(600, 0)">
      <text x="0" y="18" fill="#58E6D9" class="stat-val">1d</text>
      <text x="0" y="34" fill="#8B949E" class="stat-lbl">Active Streak</text>
    </g>
  </g>

  <!-- Language Progress Bar Track -->
  <rect x="30" y="104" width="770" height="8" rx="2" fill="#21262D" />
  <rect x="30.0" y="104" width="372.7" height="8" rx="2" fill="#F1E05A" /><rect x="402.7" y="104" width="204.1" height="8" rx="2" fill="#3572A5" /><rect x="606.7" y="104" width="104.7" height="8" rx="2" fill="#3178C6" /><rect x="711.5" y="104" width="54.7" height="8" rx="2" fill="#E34C26" /><rect x="766.1" y="104" width="23.9" height="8" rx="2" fill="#563D7C" />

  <!-- Language Legend -->
  
        <g transform="translate(30, 128)">
          <circle cx="4" cy="4" r="3.5" fill="#F1E05A" />
          <text x="13" y="7" font-family="'SF Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="10.5" fill="#E6EDF3">JavaScript <tspan fill="#8B949E">48.4%</tspan></text>
        </g>
        
        <g transform="translate(156, 128)">
          <circle cx="4" cy="4" r="3.5" fill="#3572A5" />
          <text x="13" y="7" font-family="'SF Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="10.5" fill="#E6EDF3">Python <tspan fill="#8B949E">26.5%</tspan></text>
        </g>
        
        <g transform="translate(254, 128)">
          <circle cx="4" cy="4" r="3.5" fill="#3178C6" />
          <text x="13" y="7" font-family="'SF Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="10.5" fill="#E6EDF3">TypeScript <tspan fill="#8B949E">13.6%</tspan></text>
        </g>
        
        <g transform="translate(380, 128)">
          <circle cx="4" cy="4" r="3.5" fill="#E34C26" />
          <text x="13" y="7" font-family="'SF Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="10.5" fill="#E6EDF3">HTML <tspan fill="#8B949E">7.1%</tspan></text>
        </g>
        
        <g transform="translate(464, 128)">
          <circle cx="4" cy="4" r="3.5" fill="#563D7C" />
          <text x="13" y="7" font-family="'SF Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="10.5" fill="#E6EDF3">CSS <tspan fill="#8B949E">3.1%</tspan></text>
        </g>
        
</svg>
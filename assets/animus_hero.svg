<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="320">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030611"/>
      <stop offset="50%" stop-color="#080f24"/>
      <stop offset="100%" stop-color="#020409"/>
    </linearGradient>
    <linearGradient id="red-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff003c"/>
      <stop offset="100%" stop-color="#8a0020"/>
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 240, 255, 0.05)" stroke-width="1"/>
      <circle cx="40" cy="40" r="1" fill="rgba(0, 240, 255, 0.25)"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-strong" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulse-scan {
      0% { transform: translateY(0); opacity: 0.15; }
      50% { transform: translateY(320px); opacity: 0.7; }
      100% { transform: translateY(0); opacity: 0.15; }
    }
    @keyframes radar-spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes hud-blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .radar {
      transform-origin: 130px 160px;
      animation: radar-spin 20s linear infinite;
    }
    .pulse-line {
      animation: pulse-scan 7s ease-in-out infinite;
    }
    .blink {
      animation: hud-blink 2s ease-in-out infinite;
    }
    .text-title {
      font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
      font-weight: 800;
      letter-spacing: 4px;
    }
    .text-sub {
      font-family: 'JetBrains Mono', 'Fira Code', 'Segoe UI', monospace;
      letter-spacing: 1.5px;
      font-size: 11px;
    }
  </style>

  <!-- Background Layer -->
  <rect width="1000" height="320" fill="url(#bg-grad)"/>
  <rect width="1000" height="320" fill="url(#grid)"/>

  <!-- Scanning Line -->
  <line x1="0" y1="0" x2="1000" y2="0" stroke="rgba(0, 240, 255, 0.45)" stroke-width="1.5" class="pulse-line" filter="url(#glow)"/>

  <!-- Outer HUD Frame Brackets -->
  <path d="M 20 50 L 20 20 L 50 20" fill="none" stroke="#ff003c" stroke-width="2"/>
  <path d="M 980 50 L 980 20 L 950 20" fill="none" stroke="#00f0ff" stroke-width="2"/>
  <path d="M 20 270 L 20 300 L 50 300" fill="none" stroke="#00f0ff" stroke-width="2"/>
  <path d="M 980 270 L 980 300 L 950 300" fill="none" stroke="#ff003c" stroke-width="2"/>

  <!-- Top System Header -->
  <text x="35" y="38" fill="#00f0ff" class="text-sub">[ANIMUS // NEURAL SYNCHRONIZATION INTERFACE v9.84]</text>
  <circle cx="950" cy="34" r="4" fill="#ff003c" class="blink"/>
  <text x="940" y="38" text-anchor="end" fill="#ff003c" class="text-sub">EAGLE VISION: CALIBRATED // LIVE</text>

  <!-- Left: Assassin Creed Insignia & Radar Reticles -->
  <circle cx="130" cy="160" r="85" fill="none" stroke="rgba(255, 0, 60, 0.25)" stroke-width="1"/>
  <circle cx="130" cy="160" r="98" fill="none" stroke="rgba(0, 240, 255, 0.3)" stroke-width="1" stroke-dasharray="6 8" class="radar"/>
  <circle cx="130" cy="160" r="112" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

  <!-- Insignia Shape -->
  <g transform="translate(5, 5)">
    <!-- Insignia Ambient Glow -->
    <path d="M 125 55 C 110 100, 75 170, 55 230 C 65 245, 85 240, 100 215 C 107 230, 115 245, 125 265 C 135 245, 143 230, 150 215 C 165 240, 185 245, 195 230 C 175 170, 140 100, 125 55 Z M 125 110 C 115 150, 100 185, 90 205 C 103 197, 113 197, 125 207 C 137 197, 147 197, 160 205 C 150 185, 135 150, 125 110 Z" fill="none" stroke="#ff003c" stroke-width="8" opacity="0.35" filter="url(#glow-strong)"/>
    <!-- Insignia Solid Blade Body -->
    <path d="M 125 55 C 110 100, 75 170, 55 230 C 65 245, 85 240, 100 215 C 107 230, 115 245, 125 265 C 135 245, 143 230, 150 215 C 165 240, 185 245, 195 230 C 175 170, 140 100, 125 55 Z M 125 110 C 115 150, 100 185, 90 205 C 103 197, 113 197, 125 207 C 137 197, 147 197, 160 205 C 150 185, 135 150, 125 110 Z" fill="url(#red-glow)" stroke="#00f0ff" stroke-width="1.8"/>
  </g>

  <!-- Center Dossier & Metadata -->
  <g transform="translate(265, 0)">
    <text x="0" y="86" fill="#64748b" class="text-sub">OPERATIVE DOSSIER // DNA ARCHIVE: VAIDYA_01</text>
    <text x="0" y="126" fill="#ffffff" font-size="34" class="text-title" filter="url(#glow)">ISHAN VAIDYA</text>
    <text x="0" y="154" fill="#ff003c" font-size="13" class="text-title">MASTER SYSTEMS ARCHITECT &amp; AI ENGINEER</text>
    
    <text x="0" y="188" fill="#94a3b8" class="text-sub">SECTOR: PUNE, INDIA // NODE: VIT CHENNAI [B.TECH CSE]</text>
    <text x="0" y="210" fill="#38bdf8" class="text-sub">FOCUS: HIGH-CONCURRENCY BACKENDS // AUTONOMOUS AGENT SWARMS</text>
    
    <!-- The Creed Banner -->
    <rect x="0" y="230" width="445" height="34" fill="rgba(255, 0, 60, 0.08)" stroke="rgba(255, 0, 60, 0.4)" stroke-width="1" rx="2"/>
    <text x="14" y="252" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="1.5px" font-style="italic">
      &quot;NOTHING IS TRUE. EVERYTHING IS PERMITTED.&quot;
    </text>
  </g>

  <!-- Right: Animus Neural Telemetry Console -->
  <g transform="translate(735, 72)">
    <rect x="0" y="0" width="235" height="198" fill="rgba(6, 12, 28, 0.85)" stroke="rgba(0, 240, 255, 0.3)" stroke-width="1" rx="4"/>
    <path d="M 0 0 L 26 0 L 0 26 Z" fill="#00f0ff" opacity="0.6"/>
    
    <text x="16" y="26" fill="#00f0ff" class="text-sub" font-weight="bold">// SYNCHRONIZATION</text>
    
    <!-- Sync Progress Bar -->
    <rect x="16" y="36" width="200" height="10" fill="#0f172a" rx="2" stroke="rgba(0, 240, 255, 0.25)" stroke-width="1"/>
    <rect x="18" y="38" width="190" height="6" fill="url(#cyan-glow)" rx="1"/>
    <text x="16" y="62" fill="#38bdf8" class="text-sub">FIDELITY: 99.84% [SYNCHED]</text>
    
    <line x1="16" y1="73" x2="216" y2="73" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
    
    <text x="16" y="93" fill="#e2e8f0" class="text-sub">MEMORY BLOCKS: 03/03</text>
    <text x="16" y="113" fill="#94a3b8" class="text-sub">ISOLATION: ACID / ROW-LOCKS</text>
    <text x="16" y="133" fill="#94a3b8" class="text-sub">SWARMS: 7 AGENT CORES</text>
    <text x="16" y="153" fill="#ff003c" class="text-sub">RACE CONDITIONS: 0 TOLERANCE</text>
    <text x="16" y="175" fill="#00f0ff" class="text-sub">SECURITY: OMEGA CLEARANCE</text>
  </g>

  <!-- Bottom Coordinates -->
  <text x="35" y="296" fill="#475569" class="text-sub">COORDS: 18.5204° N, 73.8567° E // REPOSITORY: GITHUB.COM/ISHANVAIDYA01</text>
  <text x="965" y="296" text-anchor="end" fill="#475569" class="text-sub">PROTOCOL: IDEMPOTENT MUTATIONS // ZERO-DATA-EGRESS</text>
</svg>
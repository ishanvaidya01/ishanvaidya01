<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 405 168" width="100%" height="168" fill="none">
  <defs>
    <style>
      .mono { font-family: 'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
      .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
    </style>
  </defs>

  <!-- Card Frame -->
  <rect width="405" height="168" rx="7" fill="#0D1117" stroke="#30363D" stroke-width="1.2"/>

  <!-- Content -->
  <g transform="translate(18, 18)">
    <!-- Header: Title + Tag -->
    <text x="0" y="14" fill="#E6EDF3" class="sans" font-size="15" font-weight="700">ECRAS</text>
    <rect x="270" y="0" width="100" height="18" rx="9" fill="rgba(88, 230, 217, 0.15)"/>
    <text x="320" y="12.5" text-anchor="middle" fill="#58E6D9" class="mono" font-size="8.5" font-weight="700">DUAL-STORE</text>

    <!-- Pitch Line 1 & 2 (Primary) -->
    <text x="0" y="46" fill="#E6EDF3" class="sans" font-size="11" font-weight="500">Enterprise recruitment bias auditor synchronizing</text><text x="0" y="62" fill="#E6EDF3" class="sans" font-size="11" font-weight="500">Oracle XE with ChromaDB vector store.</text>

    <!-- Pitch Line 3 & 4 (Architecture) -->
    <text x="0" y="80" fill="#8B949E" class="sans" font-size="10.8">PL/SQL autonomous transactions enforce tamper-evident,</text><text x="0" y="95" fill="#8B949E" class="sans" font-size="10.8">auditable EEOC compliance.</text>

    <!-- Stack Chips -->
    <g transform="translate(0, 122)">
      
        <rect x="0" y="0" width="75.19999999999999" height="19" rx="3.5" fill="#21262D" stroke="#30363D"/>
        <text x="37.599999999999994" y="12.5" text-anchor="middle" fill="#C9D1D9" font-family="'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="9">Oracle XE</text>
        
        <rect x="81.19999999999999" y="0" width="68.4" height="19" rx="3.5" fill="#21262D" stroke="#30363D"/>
        <text x="115.39999999999999" y="12.5" text-anchor="middle" fill="#C9D1D9" font-family="'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="9">ChromaDB</text>
        
        <rect x="155.6" y="0" width="54.8" height="19" rx="3.5" fill="#21262D" stroke="#30363D"/>
        <text x="183.0" y="12.5" text-anchor="middle" fill="#C9D1D9" font-family="'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="9">PL/SQL</text>
        
        <rect x="216.39999999999998" y="0" width="95.6" height="19" rx="3.5" fill="#21262D" stroke="#30363D"/>
        <text x="264.2" y="12.5" text-anchor="middle" fill="#C9D1D9" font-family="'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="9">ONNX Runtime</text>
        
    </g>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 130" width="100%" height="130" fill="none">
  <defs>
    <style>
      @keyframes ping {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.25; }
      }
      .ping { animation: ping 1.6s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) {
        .ping { animation: none !important; }
      }
    </style>
  </defs>

  <!-- Outer Boundary -->
  <rect width="830" height="130" rx="8" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.2"/>

  <!-- Channel 01: Email -->
  
  <g transform="translate(15, 15)">
    <rect width="260" height="100" rx="8" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.2"/>
    <circle cx="34" cy="50" r="15" fill="rgba(13, 148, 136, 0.12)" stroke="#0D9488" stroke-opacity="0.35" stroke-width="1"/>
    <text x="34" y="54" text-anchor="middle" font-family="'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#0D9488">@</text>
    <text x="60" y="34" font-family="'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="9" font-weight="700" letter-spacing="1" fill="#0D9488">CH_01 // DIRECT MAIL</text>
    <text x="60" y="54" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#1F2328">Email</text>
    <text x="60" y="74" font-family="'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#656D76">ishan.vaidya01@gmail.com</text>
    <circle cx="245" cy="15" r="3" fill="#16A34A" class="ping"/>
  </g>
  <!-- Channel 02: LinkedIn -->
  
  <g transform="translate(285, 15)">
    <rect width="260" height="100" rx="8" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.2"/>
    <circle cx="34" cy="50" r="15" fill="rgba(13, 148, 136, 0.12)" stroke="#0D9488" stroke-opacity="0.35" stroke-width="1"/>
    <text x="34" y="54" text-anchor="middle" font-family="'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#0D9488">in</text>
    <text x="60" y="34" font-family="'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="9" font-weight="700" letter-spacing="1" fill="#0D9488">CH_02 // NETWORK NODE</text>
    <text x="60" y="54" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#1F2328">LinkedIn</text>
    <text x="60" y="74" font-family="'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#656D76">linkedin.com/in/ishanvaidya-cse</text>
    <circle cx="245" cy="15" r="3" fill="#16A34A" class="ping"/>
  </g>
  <!-- Channel 03: GitHub -->
  
  <g transform="translate(555, 15)">
    <rect width="260" height="100" rx="8" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.2"/>
    <circle cx="34" cy="50" r="15" fill="rgba(13, 148, 136, 0.12)" stroke="#0D9488" stroke-opacity="0.35" stroke-width="1"/>
    <text x="34" y="54" text-anchor="middle" font-family="'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#0D9488">&#123; &#125;</text>
    <text x="60" y="34" font-family="'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="9" font-weight="700" letter-spacing="1" fill="#0D9488">CH_03 // CODE BASE</text>
    <text x="60" y="54" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#1F2328">Portfolio</text>
    <text x="60" y="74" font-family="'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#656D76">@ishanvaidya01</text>
    <circle cx="245" cy="15" r="3" fill="#16A34A" class="ping"/>
  </g>
